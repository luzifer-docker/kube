name: Mirror Kubernetes Images

on:
  push:
    branches:
      - develop
    paths:
      - Makefile
      - ci/mirror.sh
      - images.txt
      - .github/workflows/mirror.yaml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | skopeo login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Mirror images
        run: make mirror
